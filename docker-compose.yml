# ══════════════════════════════════════════════════════════════════════
#  Geny — Docker Compose (Standalone / Full)
#
#  전체 서비스 포함 (TTS 로컬 엔진은 --profile tts-local 로 활성화)
#
#  Usage:
#    docker compose up --build              # 기본 실행 (TTS 미포함)
#    docker compose up -d                   # 백그라운드 실행
#    docker compose --profile tts-local up  # TTS 로컬 엔진 포함
#    docker compose down                    # 종료
#    docker compose logs -f                 # 로그 확인
#
#  Port 변경:
#    BACKEND_PORT=8080 FRONTEND_PORT=3001 docker compose up --build
#
#  또는 .env 파일로 설정:
#    BACKEND_PORT=8080
#    FRONTEND_PORT=3001
#
#  TTS 설정:
#    GPT-SoVITS API URL → 설정 UI에서 http://gpt-sovits:9880 입력

# ══════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: geny-postgres
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geny}
      POSTGRES_USER: ${POSTGRES_USER:-geny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geny123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: ${TIMEZONE:-Asia/Seoul}
    volumes:
      - geny-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geny} -d ${POSTGRES_DB:-geny}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - geny-net

  # ── Backend (FastAPI + LangGraph + Claude CLI) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geny-backend
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - GENY_AGENT_STORAGE_ROOT=/data/geny_agent_sessions
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-geny}
      - POSTGRES_USER=${POSTGRES_USER:-geny}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geny123}
      - AUTO_MIGRATION=true
      - TIMEZONE=${TIMEZONE:-Asia/Seoul}
      # EnvironmentService (Phase 3)
      - ENVIRONMENT_STORAGE_PATH=${ENVIRONMENT_STORAGE_PATH:-./data/environments}
    volumes:
      - geny-tts-cache:/app/cache/tts
      - geny-voices:/app/static/voices
      # Chat attachment uploads (content-addressable: /app/static/uploads/{shard}/{sha256}.{ext}).
      # Cycle 20260424_3 PR-1: without this volume the folder was ephemeral —
      # every container restart wiped user-uploaded images.
      - geny-uploads:/app/static/uploads
      # Baked puppet zips dropped here by the avatar-editor service. Backend
      # lists pending zips and "installs" them into static/{live2d,spine}-models/,
      # then moves the consumed zip into installed/ — rw mount required.
      # See docs/plan/GENY_AVATAR_INTEGRATION.md (Phase C).
      - geny-baked-exports:/data/baked-imports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - geny-net

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=http://backend:8000
    container_name: geny-frontend
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_URL=http://backend:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - geny-net

  # ── GPT-SoVITS (Optional — TTS 로컬 엔진, GPU 필요) ──────────────
  # xxxxrt666/gpt-sovits (공식 이미지, v2 API, 한국어 지원)
  # api_v2.py → 포트 9880 서빙, webui.py → 포트 9874 (TTS Studio)
  gpt-sovits:
    image: xxxxrt666/gpt-sovits:latest-cu126
    container_name: geny-gpt-sovits
    profiles: ["tts-local"]
    init: true
    restart: unless-stopped
    working_dir: /workspace/GPT-SoVITS
    command:
      - /bin/bash
      - "-c"
      - |
        echo '[1/3] Installing nvidia-npp-cu12...';
        pip install --no-cache-dir nvidia-npp-cu12;
        echo '[2/3] Fixing torchaudio...';
        pip install --no-cache-dir --no-deps --force-reinstall torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cu126;
        echo '[3/3] Starting GPT-SoVITS...';
        rm -rf GPT_SoVITS/pretrained_models GPT_SoVITS/text/G2PWModel tools/asr/models tools/uvr5/uvr5_weights 2>/dev/null;
        ln -sf /workspace/models/pretrained_models GPT_SoVITS/pretrained_models;
        ln -sf /workspace/models/G2PWModel       GPT_SoVITS/text/G2PWModel;
        ln -sf /workspace/models/asr_models       tools/asr/models;
        ln -sf /workspace/models/uvr5_weights     tools/uvr5/uvr5_weights;
        python webui.py &
        exec python api_v2.py -a 0.0.0.0 -p 9880
    ports:
      - "127.0.0.1:${GPT_SOVITS_PORT:-9880}:9880"
      - "127.0.0.1:${GPT_SOVITS_WEBUI_PORT:-9874}:9874"
    volumes:
      - geny-voices:/workspace/GPT-SoVITS/references:ro
    tty: true
    stdin_open: true
    shm_size: 16G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - is_half=False
      - LD_LIBRARY_PATH=/root/conda/lib:/root/conda/lib/python3.12/site-packages/nvidia/npp/lib
    networks:
      - geny-net

  # ── OmniVoice (Optional — Geny 자체 TTS 마이크로서비스, GPU 필요) ─
  # geny-monorepo 내 omnivoice/ 에서 빌드. 포트 9881, voices 공유 볼륨,
  # HF 모델 캐시는 별도 영구 볼륨. GPT-SoVITS 와 동일 profile 사용.
  omnivoice:
    build:
      context: ./omnivoice
      dockerfile: Dockerfile
    image: geny-omnivoice:latest
    container_name: geny-omnivoice
    profiles: ["tts-local"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OMNIVOICE_PORT:-9881}:9881"
    environment:
      - OMNIVOICE_MODEL=${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}
      - OMNIVOICE_DEVICE=${OMNIVOICE_DEVICE:-cuda:0}
      - OMNIVOICE_DTYPE=${OMNIVOICE_DTYPE:-float16}
      # 5070(Blackwell, sm_120) 기준. 공유 GPU 환경에서는 1~2 로 내릴 것.
      - OMNIVOICE_MAX_CONCURRENCY=${OMNIVOICE_MAX_CONCURRENCY:-4}
      - OMNIVOICE_DEFAULT_NUM_STEP=${OMNIVOICE_DEFAULT_NUM_STEP:-16}
      - OMNIVOICE_GPU_MEMORY_FRACTION=${OMNIVOICE_GPU_MEMORY_FRACTION:-0.85}
      - OMNIVOICE_AUTO_ASR=${OMNIVOICE_AUTO_ASR:-false}
      - OMNIVOICE_LOG_LEVEL=${OMNIVOICE_LOG_LEVEL:-info}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      - geny-voices:/voices:ro
      - geny-omnivoice-models:/models
    shm_size: 8G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9881/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - geny-net

  # ── Avatar Editor (geny-avatar submodule, Next.js) ────────────────
  # Standalone Next.js app from vendor/geny-avatar (pinned to v0.2.0).
  # Lets users edit Spine/Cubism puppets in-browser and "Send to Geny"
  # baked model zips, which land in the geny-baked-exports volume the
  # backend reads from. Standalone compose has no nginx in front, so
  # the editor binds directly to a host port (default 3001).
  #
  # Build context is the submodule path — fresh clones must run
  # `git submodule update --init --recursive` first or the build fails.
  avatar-editor:
    build:
      context: ./vendor/geny-avatar
      dockerfile: Dockerfile
    container_name: geny-avatar-editor
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AVATAR_EDITOR_PORT:-3001}:3000"
    environment:
      # Standalone compose has no reverse proxy → avatar-editor served
      # at root, so basePath stays empty (Next.js falls back to "/" routes).
      - NEXT_PUBLIC_BASE_PATH=
      # Enables the "send to Geny" button + the /api/send-to-geny route.
      - NEXT_PUBLIC_GENY_HOST=true
      - GENY_BAKED_EXPORTS_DIR=/exports
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    volumes:
      # Write side of the shared baked-zip handoff (backend mounts the
      # same volume read-only at /data/baked-imports).
      - geny-baked-exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - geny-net


networks:
  geny-net:
    driver: bridge

volumes:
  geny-pgdata:
    driver: local
  geny-tts-cache:
    driver: local
  geny-voices:
    driver: local
  geny-uploads:
    driver: local
  geny-omnivoice-models:
    driver: local
  # Shared between avatar-editor (rw at /exports) and backend (ro at
  # /data/baked-imports). Carries baked puppet zips from the editor's
  # "send to Geny" action to the backend's import flow.
  geny-baked-exports:
    driver: local
