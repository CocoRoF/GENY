# Geny-integration override for GAPT's vendored tunnel compose.
#
# Layers on top of gapt/compose/docker-compose.tunnel.yml to:
#   - give the containers stable names (gapt-server / gapt-postgres /
#     gapt-caddy) so Geny + nginx can target them deterministically,
#   - put the control-plane server on `gapt-net` with the alias
#     `gapt-server` so geny-backend (also on gapt-net) can call the API
#     at http://gapt-server:8088/_gapt/api directly,
#   - set the single-admin credentials Geny's GaptClient logs in with,
#   - pin the workspace runtime to sysbox-runc (installed on the host).
#
# GAPT's own cloudflared lives behind the `tunnel` profile in the base
# file, so by NOT passing `--profile tunnel` it stays OFF — Geny's
# existing nginx fronts caddy (published on 127.0.0.1:38080) instead.
#
# Deploy (from the Geny repo root on the host):
#   docker compose \
#     -f gapt/compose/docker-compose.tunnel.yml \
#     -f deploy/gapt/docker-compose.geny.yml \
#     --env-file deploy/gapt/.env up -d --build
#
# See docs/operations/gapt-deploy.md.

name: gapt-tunnel

services:
  postgres:
    container_name: gapt-postgres

  server:
    container_name: gapt-server
    environment:
      GAPT_ADMIN_ID: ${GAPT_ADMIN_ID:-admin}
      GAPT_ADMIN_PASSWORD: ${GAPT_ADMIN_PASSWORD:?GAPT_ADMIN_PASSWORD required}
      # The host has sysbox-runc registered (zero-downtime SIGHUP enable).
      GAPT_SANDBOX_RUNTIME: ${GAPT_SANDBOX_RUNTIME:-sysbox-runc}
      # Workspace containers (gapt-ws-<id>, what Geny execs into) on sysbox
      # for kernel-level isolation. Empty = runc.
      GAPT_WORKSPACE_RUNTIME: ${GAPT_WORKSPACE_RUNTIME:-}
      # One Geny session = one GAPT 'bind' workspace: allow bind workspaces
      # rooted at the Geny agent-sessions volume (host path). Empty = bind
      # workspaces disabled (worktree-only, the OSS default).
      GAPT_BIND_WORKSPACE_ROOTS: ${GENY_AGENT_SESSIONS_HOST_DIR:-}
    volumes:
      # The server validates bind dirs with an isdir() check and serves the
      # workspace file APIs from them — mount the sessions volume at the
      # SAME path the host sees so both the check and `docker run -v`
      # agree. The noop default keeps deployments without the env valid.
      - ${GENY_AGENT_SESSIONS_HOST_DIR:-/var/empty}:${GENY_AGENT_SESSIONS_HOST_DIR:-/var/empty}:rw
    networks:
      default: {}
      gapt-net:
        aliases:
          - gapt-server

  caddy:
    container_name: gapt-caddy
    # Also join Geny's network so geny-nginx can reverse-proxy /_gapt and
    # /preview to gapt-caddy by container name. Declared here (not a manual
    # `docker network connect`) so it survives every caddy recreate.
    networks:
      default: {}
      gapt-net: {}
      geny-prod: {}

networks:
  # Defined (created) by the base tunnel compose as name: gapt-net.
  gapt-net:
    name: gapt-net
  # Geny's prod network (created by docker-compose.prod.yml as the
  # "geny" project's geny-net-prod). External here so gapt-caddy can join it.
  geny-prod:
    name: geny_geny-net-prod
    external: true
