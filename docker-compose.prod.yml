# ══════════════════════════════════════════════════════════════════════
#  Geny — Docker Compose (Production with Nginx Reverse Proxy / Full)
#
#  도메인을 연결하여 단일 포트(80)로 backend / frontend를 라우팅합니다.
#  로컬 오디오 엔진 (TTS / STT) 은 --profile audio-local 로 활성화할 수 있습니다.
#
#    /api/*            → backend:8000
#    /health           → backend:8000
#    /static/assets/*  → backend:8000
#    /*                → frontend:3000
#
#  Usage:
#    docker compose -f docker-compose.prod.yml up --build -d
#    docker compose -f docker-compose.prod.yml --profile audio-local up --build -d
#    docker compose -f docker-compose.prod.yml down
#    docker compose -f docker-compose.prod.yml logs -f
#
#  경량 버전 (TTS 없음):
#    docker compose -f docker-compose.prod-core.yml up --build -d
#
#  도메인 / SSL 설정:
#    DOMAIN=geny.example.com  → nginx server_name 에 반영
#    SSL 은 별도의 certbot 또는 Cloudflare 등으로 처리 후
#    nginx/nginx.conf 에 443 블록을 추가하세요.
#
#  Port 변경:
#    NGINX_PORT=58443 docker compose -f docker-compose.prod.yml up --build
#
#  TTS 설정:
#    GPT-SoVITS API URL → 설정 UI에서 http://gpt-sovits:9880 입력

# ══════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: geny-postgres-prod
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geny}
      POSTGRES_USER: ${POSTGRES_USER:-geny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geny123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: ${TIMEZONE:-Asia/Seoul}
    volumes:
      - geny-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geny} -d ${POSTGRES_DB:-geny}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - geny-net-prod

  # ── Backend (FastAPI + LangGraph + Claude CLI) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geny-backend-prod
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - GENY_AGENT_STORAGE_ROOT=/data/geny_agent_sessions
      # PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-geny}
      - POSTGRES_USER=${POSTGRES_USER:-geny}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geny123}
      - AUTO_MIGRATION=true
      - TIMEZONE=${TIMEZONE:-Asia/Seoul}
      # EnvironmentService (Phase 3)
      - ENVIRONMENT_STORAGE_PATH=${ENVIRONMENT_STORAGE_PATH:-./data/environments}
    volumes:
      - geny-tts-cache-prod:/app/cache/tts
      - geny-voices-prod:/app/static/voices
      # Chat attachment uploads (cycle 20260424_3 PR-1) — without a named
      # volume here every container restart wiped user-uploaded images.
      - geny-uploads-prod:/app/static/uploads
      # Geny agent storage root — holds every session's chat history,
      # plus the per-user Opsidian vaults (_user_opsidian/<user>/...)
      # with their notes, _attachments/, and _captures.jsonl. Without
      # this volume the entire backend "memory" — all user notes, all
      # audio captures, all transcripts — lives on the container's
      # writable layer and gets wiped on every ``docker compose up
      # --build backend``. Discovered 2026-05-14 when 13 inbox audio
      # memos vanished after a routine backend rebuild despite
      # ``GENY_AGENT_STORAGE_ROOT`` being set in the env block above.
      - geny-agent-sessions-prod:/data/geny_agent_sessions
      # Baked puppet zips dropped here by avatar-editor. Backend reads + moves to
      # installed/ subdir after install (rw — was :ro before C.3 added install).
      - geny-baked-exports-prod:/data/baked-imports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - geny-net-prod

  # ── Frontend (Next.js) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=http://backend:8000
        - NEXT_PUBLIC_API_URL=
    container_name: geny-frontend-prod
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - geny-net-prod

  # ── Nginx Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: geny-nginx-prod
    init: true
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-58443}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      avatar-editor:
        condition: service_started
    networks:
      - geny-net-prod

  # ── GPT-SoVITS (DISABLED — OmniVoice 로 전환, 2026-04-23) ────────
  # 더 이상 사용하지 않음. 필요 시 아래 블록을 주석 해제하여 복구.
  # xxxxrt666/gpt-sovits (공식 이미지, v2 API, 한국어 지원)
  # api_v2.py → 포트 9880 서빙, webui.py → 포트 9874 (TTS Studio)
  # gpt-sovits:
  #   image: xxxxrt666/gpt-sovits:latest-cu126
  #   container_name: geny-gpt-sovits-prod
  #   profiles: ["audio-local"]
  #   init: true
  #   restart: unless-stopped
  #   working_dir: /workspace/GPT-SoVITS
  #   command:
  #     - /bin/bash
  #     - "-c"
  #     - |
  #       echo '[1/3] Installing nvidia-npp-cu12...';
  #       pip install --no-cache-dir nvidia-npp-cu12;
  #       echo '[2/3] Fixing torchaudio...';
  #       pip install --no-cache-dir --no-deps --force-reinstall torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cu126;
  #       echo '[3/3] Starting GPT-SoVITS...';
  #       rm -rf GPT_SoVITS/pretrained_models GPT_SoVITS/text/G2PWModel tools/asr/models tools/uvr5/uvr5_weights 2>/dev/null;
  #       ln -sf /workspace/models/pretrained_models GPT_SoVITS/pretrained_models;
  #       ln -sf /workspace/models/G2PWModel       GPT_SoVITS/text/G2PWModel;
  #       ln -sf /workspace/models/asr_models       tools/asr/models;
  #       ln -sf /workspace/models/uvr5_weights     tools/uvr5/uvr5_weights;
  #       python webui.py &
  #       exec python api_v2.py -a 0.0.0.0 -p 9880
  #   expose:
  #     - "9880"
  #     - "9874"
  #   volumes:
  #     - geny-voices-prod:/workspace/GPT-SoVITS/references:ro
  #   tty: true
  #   stdin_open: true
  #   shm_size: 16G
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   environment:
  #     - is_half=False
  #     - GRADIO_ROOT_PATH=/tts-studio
  #     - LD_LIBRARY_PATH=/root/conda/lib:/root/conda/lib/python3.12/site-packages/nvidia/npp/lib
  #   networks:
  #     - geny-net-prod

  # ── OmniVoice (Optional — Geny 자체 TTS 마이크로서비스, GPU 필요) ─
  # geny-monorepo 내 omnivoice/ 에서 빌드. 외부 노출 없이 backend 가
  # http://omnivoice:9881 로 호출. HF 모델 캐시는 영구 볼륨에.
  omnivoice:
    build:
      context: ./omnivoice
      dockerfile: Dockerfile
    image: geny-omnivoice:prod
    container_name: geny-omnivoice-prod
    profiles: ["audio-local"]
    init: true
    restart: unless-stopped
    expose:
      - "9881"
    environment:
      - OMNIVOICE_MODEL=${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}
      - OMNIVOICE_DEVICE=${OMNIVOICE_DEVICE:-cuda:0}
      - OMNIVOICE_DTYPE=${OMNIVOICE_DTYPE:-float16}
      # GPU 동시 합성 슬롯 (asyncio.Semaphore). 2026-04 RTX 5070
      # (Blackwell, sm_120, 12GB, Tensor cores) 로 업그레이드하며 4 로 상향.
      # 더 작은 GPU 또는 공유 호스트에서는 1~2 로 내릴 것.
      - OMNIVOICE_MAX_CONCURRENCY=${OMNIVOICE_MAX_CONCURRENCY:-1}
      # Diffusion outer-loop step 수. 원본 기본값 32. 16 = 품질/속도 균형
      # (5070 측정 기준 RTF 충분히 안정). 음질 우선이면 24, 속도 우선이면
      # 8~12 까지 내릴 수 있음.
      - OMNIVOICE_DEFAULT_NUM_STEP=${OMNIVOICE_DEFAULT_NUM_STEP:-24}
      # CUDA 컨텍스트 메모리 단편화 방지. 0.85 = 12GB 5070 에서 ~10.2GB
      # 예약 (전용 GPU 호스트 기준). 공유 시 0.5~0.7 로 낮춰서 운영.
      # 0 으로 두면 비활성화.
      - OMNIVOICE_GPU_MEMORY_FRACTION=${OMNIVOICE_GPU_MEMORY_FRACTION:-0.5}
      - OMNIVOICE_AUTO_ASR=${OMNIVOICE_AUTO_ASR:-false}
      - OMNIVOICE_LOG_LEVEL=${OMNIVOICE_LOG_LEVEL:-info}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      - geny-voices-prod:/voices:ro
      - geny-omnivoice-models-prod:/models
      # Output-equivalence baselines persist across container restarts so
      # every Tier-A PR can be diffed against the same reference PCM.
      - ./omnivoice/baselines:/baselines
    shm_size: 8G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9881/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - geny-net-prod

  # ── Avatar Editor (geny-avatar submodule, Next.js) — Prod ─────────
  # In prod, nginx terminates external traffic and proxies the
  # /avatar-editor/ prefix to this service over the geny-net-prod
  # network. avatar-editor is therefore internal-only (no host port)
  # and built with NEXT_PUBLIC_BASE_PATH=/avatar-editor so all routes,
  # static assets, and apiUrl() fetches resolve under that prefix.
  avatar-editor:
    build:
      context: ./vendor/geny-avatar
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the JS bundle by next build —
        # they MUST be passed as build args, not just runtime env, or
        # the bundle ships with empty values. basePath drives routing,
        # GENY_HOST gates the "send to Geny" button + /api/send-to-geny
        # route in the avatar-editor app.
        NEXT_PUBLIC_BASE_PATH: /avatar-editor
        NEXT_PUBLIC_GENY_HOST: "true"
    container_name: geny-avatar-editor-prod
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_BASE_PATH=/avatar-editor
      - NEXT_PUBLIC_GENY_HOST=true
      - GENY_BAKED_EXPORTS_DIR=/exports
      # AI provider keys consumed by the editor's Generate panel API
      # routes (lib/ai/providers/registry.ts). Empty default means the
      # provider shows up as "<KEY> not set" in the dropdown without
      # crashing. Set in your .env to enable.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    volumes:
      - geny-baked-exports-prod:/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/avatar-editor/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - geny-net-prod

  # ── Whisper STT (Optional — vLLM 기반 음성 전사, GPU 필요) ────────
  # geny-monorepo 내 whisper-stt/ 에서 빌드. 외부 노출 없이 backend 가
  # http://whisper-stt:8001 로 호출. vLLM 의 OpenAI 호환
  # /v1/audio/transcriptions endpoint 를 그대로 사용.
  #
  # GPU 분할 (RTX 5070 12GB):
  #   omnivoice  → 0.50 (≈ 6 GB)
  #   whisper    → 0.35 (≈ 4 GB)
  #   ────────────────────
  #   합계         0.85  (≈ 10 GB)  ← 15% 여유로 OOM 방지
  whisper-stt:
    build:
      context: ./whisper-stt
      dockerfile: Dockerfile
    image: geny-whisper-stt:prod
    container_name: geny-whisper-stt-prod
    profiles: ["audio-local"]
    init: true
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-openai/whisper-large-v3}
      - WHISPER_PORT=${WHISPER_PORT:-8001}
      # vLLM 의 GPU 메모리 점유율. OmniVoice 와 같은 GPU 위에서
      # 공존 가능하도록 보수적 분할.
      - WHISPER_GPU_MEMORY_FRACTION=${WHISPER_GPU_MEMORY_FRACTION:-0.35}
      - WHISPER_DTYPE=${WHISPER_DTYPE:-auto}
      # FlashAttention 2 stalls on Blackwell (sm_120, RTX 50 series)
      # on the encoder-decoder Whisper path — observed as a 24+ min
      # hang right after "Using FLASH_ATTN attention backend". The
      # entrypoint passes this through as `vllm serve
      # --attention-backend <value>`. Default TRITON_ATTN since
      # Triton compiles its kernel JIT and doesn't need a
      # precompiled FA2 binary for sm_120. Switch to FLASH_ATTN /
      # FLASHINFER once vllm ships Blackwell-ready binaries.
      - WHISPER_ATTENTION_BACKEND=${WHISPER_ATTENTION_BACKEND:-TRITON_ATTN}
      # HuggingFace 모델 다운로드 (public 모델이라 토큰 없이 가능,
      # rate-limit 회피용으로만 옵션 제공).
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      - geny-whisper-cache-prod:/cache/huggingface
    shm_size: 4G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 첫 부팅: 모델 다운로드 (~3 GB) + vLLM 로드. 이후 부팅은
      # 캐시 hit 으로 ~30 s. 충분히 크게.
      start_period: 600s
    networks:
      - geny-net-prod


networks:
  geny-net-prod:
    driver: bridge

volumes:
  geny-pgdata-prod:
    driver: local
  geny-tts-cache-prod:
    driver: local
  geny-voices-prod:
    driver: local
  geny-uploads-prod:
    driver: local
  # Holds the backend storage root (``GENY_AGENT_STORAGE_ROOT`` →
  # ``/data/geny_agent_sessions``). Includes every session's chat
  # log, per-user Opsidian vault (notes + attachments + capture
  # logs), and the agent memory provider's file backend. Mandatory
  # for cross-rebuild persistence — see backend.volumes comment.
  geny-agent-sessions-prod:
    driver: local
  geny-omnivoice-models-prod:
    driver: local
  # Whisper 모델 가중치 영구 캐시. 첫 부팅 시 ~3 GB 다운로드.
  geny-whisper-cache-prod:
    driver: local
  # Shared between avatar-editor (rw) and backend (ro) — prod variant.
  geny-baked-exports-prod:
    driver: local
