name: Backend static checks

# WHY THIS EXISTS
#
# A single undefined name — `_prune_tasks`, added in an edit whose declaration
# never landed — raised NameError on EVERY screen-observation upload in
# production (79 in 12 hours). Nothing caught it: the module imported fine, the
# syntax was valid, and the line only ran on a request. It reached users as
# "the backend suddenly dies".
#
# The audit that followed found the same shape elsewhere: detached tasks with
# no strong reference, and synchronous filesystem calls on the event loop that
# stall the entire process. All are invisible to import and to any test that
# does not walk the exact path, and all are trivially visible to a parser.
#
# So the gate checks that family and nothing else. A broad style linter over
# 170k lines produces noise, gets ignored, and then catches nothing at all.
# See backend/scripts/check_runtime_hazards.py for the per-class rationale.

on:
  push:
    paths:
      - 'backend/**/*.py'
      - '.github/workflows/backend-lint.yml'
  pull_request:
    paths:
      - 'backend/**/*.py'
  workflow_dispatch:

jobs:
  runtime-hazards:
    name: runtime hazards / syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyflakes==3.4.0

      - name: Compile every module (syntax)
        working-directory: backend
        # Every package, not a hand-listed subset — the first version of this
        # gate listed `service controller ws tools main.py` and so left
        # routers/, hooks/ and scripts/ (745 lines) unchecked.
        run: python -m compileall -q .

      - name: Runtime hazard scan
        working-directory: backend
        run: python scripts/check_runtime_hazards.py .

  tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # The suite carried 104 permanent failures, so it could not be a gate:
      # a real regression was indistinguishable from the standing noise, and
      # the only way to find one was to diff against a baseline worktree.
      # Every failure has been resolved — repaired where the test still
      # described a real contract, retargeted where the behaviour moved, and
      # xfail(strict) with the evidence where it reports something genuinely
      # broken. Running it here keeps it that way; a new failure is now a
      # signal rather than one more line in the noise.
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q
