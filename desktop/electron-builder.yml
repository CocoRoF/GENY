appId: me.hrletsgo.geny.connector
productName: Geny
# Explicit publish provider so electron-builder can resolve update-info even with
# GH_TOKEN present (without it, the monorepo's parent .git isn't detected and it
# null-crashes on 'channel'/'provider'). Actual upload is done by the release job
# via action-gh-release; the build step runs with `--publish never`.
publish:
  provider: github
  owner: CocoRoF
  repo: Geny
directories:
  output: dist
  buildResources: build
# Ad-hoc sign the macOS .app (build/afterPack.cjs) so Apple Silicon doesn't
# hard-block the un-notarized build as "손상됨 — 휴지통으로 이동". No-op once a
# Developer ID (CSC_LINK / CSC_IDENTITY) is configured.
afterPack: build/afterPack.cjs
files:
  - out/**/*
  - package.json
# Native .node addons (keytar, nut.js, libnut) must be unpacked from the asar
# or they fail to load at runtime ("cannot find module .node").
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@nut-tree-fork/**'
# macOS is ad-hoc signed (afterPack above) — runs on Apple Silicon without the
# "damaged" hard block, but still shows the bypassable "unidentified developer"
# prompt until Developer ID + @electron/notarize land. Windows is still unsigned
# (SmartScreen "More info → Run anyway") pending an EV/OV cert.
linux:
  # StartupWMClass groups running windows with the launcher icon on GNOME/KDE.
  # electron-builder 25 spreads `desktop` keys FLAT into the .desktop entry —
  # the nested `desktop.entry` form is the v26 schema and would emit a junk
  # `entry=[object Object]` line while leaving the default StartupWMClass=Geny.
  desktop:
    StartupWMClass: geny-connector
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Geny <noreply@hrletsgo.me>
  synopsis: Geny VTuber desktop connector
win:
  target:
    - nsis
  # No spaces: the default "Geny Setup x.exe" gets renamed 3 different ways
  # (built→spaces, latest.yml→hyphens, GitHub asset→dots), so electron-updater
  # 404s on download. A hyphenated name is identical everywhere.
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  # Localize the installer UI — NSIS auto-selects by the OS language among
  # these; English + Korean both shipped.
  installerLanguages:
    - en_US
    - ko_KR
  unicode: true
  # Assisted (not one-click) so the installer can ask ONE question: whether
  # this machine uses Geny Cloud (default: yes). build/installer.nsh adds the
  # page and writes the answer as a one-shot flag the app consumes on first
  # run. Nothing else is asked — the install directory stays fixed.
  oneClick: false
  allowToChangeInstallationDirectory: false
  perMachine: false
  include: build/installer.nsh
mac:
  target:
    - dmg
  category: public.app-category.utilities

# The native virtual drive is a SIDECAR binary (Go/go-fuse): FUSE cannot
# run inside Electron — the V8 memory cage copies external buffers, so
# native reads come back corrupted (proven by spike). It ships unpacked
# next to the app resources; the connector spawns it on demand.
# Linux only for now: Windows needs the Cloud Files API (separate
# implementation) and macOS FUSE needs macFUSE installed, so those
# platforms keep the mirror drive. A missing binary is handled at
# runtime (the toggle simply doesn't appear).
extraResources:
  - from: ../drive-daemon/dist/${os}-${arch}/
    to: .
    filter:
      - geny-drive-daemon

deb:
  # Geny Drive streaming mode (roadmap) mounts through FUSE 3. Recommends —
  # NOT Depends — so `dpkg -i` never fails on a machine without it: mirror
  # mode works regardless, and the app probes at runtime
  # (drive-preflight.ts) and tells the user exactly what to install.
  recommends:
    - fuse3
  # Ubuntu 24.04 fix: the stock postinst probes userns AS ROOT and leaves
  # chrome-sandbox at 0755, but apparmor_restrict_unprivileged_userns=1
  # blocks userns for the real user at runtime → SIGTRAP on launch. The
  # custom script chmods the helper 4755 unconditionally.
  afterInstall: build/linux-after-install.tpl
  # NOTE: overriding `depends` replaces electron-builder's defaults — the
  # full default list is repeated here, plus the appindicator lib so the
  # tray (the app's only persistent UI surface) actually appears.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libayatana-appindicator3-1 | libappindicator3-1
