appId: me.hrletsgo.geny.connector
productName: Geny
# Explicit publish provider so electron-builder can resolve update-info even with
# GH_TOKEN present (without it, the monorepo's parent .git isn't detected and it
# null-crashes on 'channel'/'provider'). Actual upload is done by the release job
# via action-gh-release; the build step runs with `--publish never`.
publish:
  provider: github
  owner: CocoRoF
  repo: Geny
directories:
  output: dist
  buildResources: build
# Ad-hoc sign the macOS .app (build/afterPack.cjs) so Apple Silicon doesn't
# hard-block the un-notarized build as "손상됨 — 휴지통으로 이동". No-op once a
# Developer ID (CSC_LINK / CSC_IDENTITY) is configured.
afterPack: build/afterPack.cjs
files:
  - out/**/*
  - package.json
# Native .node addons (keytar, nut.js, libnut) must be unpacked from the asar
# or they fail to load at runtime ("cannot find module .node").
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@nut-tree-fork/**'
  - '**/node_modules/keytar/**'
# macOS is ad-hoc signed (afterPack above) — runs on Apple Silicon without the
# "damaged" hard block, but still shows the bypassable "unidentified developer"
# prompt until Developer ID + @electron/notarize land. Windows is still unsigned
# (SmartScreen "More info → Run anyway") pending an EV/OV cert.
linux:
  # StartupWMClass groups running windows with the launcher icon on GNOME/KDE.
  # electron-builder 25 spreads `desktop` keys FLAT into the .desktop entry —
  # the nested `desktop.entry` form is the v26 schema and would emit a junk
  # `entry=[object Object]` line while leaving the default StartupWMClass=Geny.
  desktop:
    StartupWMClass: geny-connector
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Geny <noreply@hrletsgo.me>
  synopsis: Geny VTuber desktop connector
win:
  target:
    - nsis
  # No spaces: the default "Geny Setup x.exe" gets renamed 3 different ways
  # (built→spaces, latest.yml→hyphens, GitHub asset→dots), so electron-updater
  # 404s on download. A hyphenated name is identical everywhere.
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  # Localize the installer's (minimal, one-click) UI — NSIS auto-selects by the
  # OS language among these; English + Korean both shipped.
  installerLanguages:
    - en_US
    - ko_KR
  unicode: true
mac:
  target:
    - dmg
  category: public.app-category.utilities

deb:
  # NOTE: overriding `depends` replaces electron-builder's defaults — the
  # full default list is repeated here, plus the appindicator lib so the
  # tray (the app's only persistent UI surface) actually appears.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libayatana-appindicator3-1 | libappindicator3-1
