upstream backend {
    server backend:8000;
}

# Note: frontend and avatar-editor are NOT defined as upstream blocks.
# Both use the runtime-resolver pattern inside their location blocks
# (see `set $..._upstream ... ; proxy_pass $..._upstream;` below). This
# means nginx -t / nginx -s reload don't fail when those containers are
# transiently down — only the gpt-sovits location used to do this; we
# extended it to frontend after a frontend restart-loop blocked an
# unrelated nginx config reload.

server {
    listen 80;
    server_name _;

    # ── Max upload size (for shared folder / file uploads) ──
    # Default for ordinary API/form traffic. The workspace (Geny Drive)
    # endpoints raise this to match the server-side cap — see the
    # /api/agents/ storage location below.
    client_max_body_size 50m;

    # ── Gzip compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Geny Drive: workspace storage (uploads / PUT / chunk parts) ──
    # These carry FILE BODIES, unlike the rest of /api/. The 50m default
    # rejected any single-shot PUT between 50MiB and the connector's 64MiB
    # chunking threshold — a silent hole in the middle of the size range —
    # and capped browser uploads far below the server's own limit
    # (GENY_WORKSPACE_MAX_FILE_MB, default 500). Keep this in sync with it.
    #
    # request buffering is OFF so a large upload streams straight through
    # instead of being spooled to nginx's disk first (halves the write I/O
    # and lets the backend's quota/base_sha checks fail fast).
    location ~ ^/api/agents/[^/]+/storage(/|$) {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size    512m;
        client_body_timeout     600s;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        gzip                    off;
    }

    # ── Backend: WebDAV (Geny Drive protocol surface) ───────
    # Mount clients stream large bodies both ways and Finder PUTs with
    # Transfer-Encoding: chunked (no Content-Length) — request buffering
    # must be OFF or nginx would spool/reject. Auth is the backend's own
    # Basic/app-password layer, so nothing extra here.
    location /dav {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $edge_proto;

        client_max_body_size    512m;
        client_body_timeout     600s;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        gzip                    off;
    }

    # ── Backend: API routes ─────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) support — disable ALL buffering layers
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable gzip for SSE — gzip buffers output which breaks streaming
        gzip               off;

        # Ensure chunked transfer works and connection stays open
        chunked_transfer_encoding on;
        proxy_set_header   Connection '';

        # Pass X-Accel-Buffering from backend (backend sends "no" for SSE)
        proxy_pass_header  X-Accel-Buffering;

        # WebSocket support (if needed in the future)
        # Note: for SSE we use Connection '' above; for WS use upgrade map
    }

    # ── Backend: WebSocket endpoints ───────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Backend: Health check endpoints ─────────────────────
    # Prefix, not an exact match: /health is liveness (is the process still
    # serving?) and /health/ready is readiness (are its dependencies usable?).
    # They are deliberately separate — only liveness drives the container
    # healthcheck and autoheal, because restarting the backend cannot fix a
    # database outage and would just add a restart loop on top of it. An
    # exact `= /health` left /health/ready falling through to the frontend,
    # which answered a 200-shaped SPA 404 page.
    location ^~ /health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── GAPT (sandbox / project / devops platform) ──────────
    # gapt-caddy (the vendored GAPT edge) serves the SPA (/_gapt/app),
    # the control-plane API (/_gapt/api), and per-workspace previews
    # (/preview/<slug>). It is connected to this docker network at
    # deploy time. Use the docker resolver + a variable upstream so a
    # down / redeployed gapt-caddy never blocks an nginx reload (same
    # defensive pattern as the frontend/avatar upstreams).
    location /_gapt/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $gapt_edge http://gapt-caddy:8080;
        proxy_pass         $gapt_edge$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket (workspace terminal) + SSE (sessions/deploy streams)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location /preview/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $gapt_preview http://gapt-caddy:8080;
        proxy_pass         $gapt_preview$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }

    # ── Backend: Static assets (3D models, etc.) ────────────
    location /static/assets/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache static assets
        proxy_cache_valid  200 1h;
        expires            1h;
        add_header         Cache-Control "public, immutable";
    }

    # ── Backend: Chat attachment uploads ───────────────────
    # Content-addressable files produced by POST /api/uploads
    # (sha256-named). Served via FastAPI StaticFiles mount on
    # /app/static/uploads, backed by the geny-uploads docker volume.
    location /static/uploads/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Immutable content (sha256-addressed) — cache aggressively.
        proxy_cache_valid  200 1d;
        expires            1d;
        add_header         Cache-Control "public, max-age=86400, immutable";
    }

    # ── Backend: Live2D model files (long cache) ────────────
    location /static/live2d-models/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Live2D models are large binary assets — cache aggressively
        proxy_cache_valid  200 1d;
        expires            1d;
        add_header         Cache-Control "public, max-age=86400";
        add_header         Access-Control-Allow-Origin *;
    }

    # ── Backend: MMD (PMX) model files (long cache) ─────────
    # Same policy as live2d-models. Spine assets historically fall
    # through `location /` (extra Next.js hop, no cache) — the MMD
    # runtime gets a deliberate cached location instead of inheriting
    # that accident: PMX + textures for one model run tens of MB.
    location /static/mmd-models/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_valid  200 1d;
        expires            1d;
        add_header         Cache-Control "public, max-age=86400";
        add_header         Access-Control-Allow-Origin *;
    }

    # ── GPT-SoVITS WebUI (TTS Studio) ──────────────────────
    # Uses runtime DNS resolution so nginx starts even when
    # the gpt-sovits container is not running (--profile tts-local).
    location /tts-studio/ {
        resolver 127.0.0.11 valid=30s;
        set $gpt_sovits_upstream http://gpt-sovits:9874;
        proxy_pass         $gpt_sovits_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Gradio WebSocket support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # File uploads for training data
        client_max_body_size 500m;
        proxy_read_timeout   600s;
    }

    # ── geny-avatar editor (separate Next.js, /avatar-editor prefix) ──
    # The avatar-editor container is built with NEXT_PUBLIC_BASE_PATH=
    # /avatar-editor, so the upstream itself expects URIs that include
    # that prefix. proxy_pass WITHOUT a trailing slash preserves the
    # original URI — what reaches the upstream is exactly what the
    # browser asked for. Adding a trailing slash here would silently
    # strip the prefix and 404.
    #
    # Why `^~ /avatar-editor` and not `/avatar-editor/`:
    # Next.js with default `trailingSlash: false` serves the basePath
    # home at /avatar-editor (no slash) and 308-redirects /avatar-editor/
    # back to it. The location pattern needs to catch BOTH forms so the
    # 308 has somewhere to land — `/avatar-editor/` alone wouldn't match
    # the no-slash form and would fall through to the catch-all (frontend
    # → 404). We previously tried adding a 301 from /avatar-editor →
    # /avatar-editor/ at this layer; that produced a redirect loop with
    # Next.js's 308 in the opposite direction. The `^~` prefix match
    # forwards both bare and slashed forms straight to the upstream and
    # lets Next.js own the canonical-URL decision.
    location ^~ /avatar-editor {
        # Runtime DNS resolution so this location works even when the
        # avatar-editor container is briefly unhealthy/restarting —
        # nginx -t / -s reload don't depend on it.
        resolver 127.0.0.11 valid=30s;
        set $avatar_editor_upstream http://avatar-editor:3000;
        proxy_pass         $avatar_editor_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # baked puppet zips can run 30–50MB — bump above the global 50m
        # so /api/send-to-geny POST has headroom on big atlases.
        client_max_body_size 100m;

        # Next.js production may use WebSockets for things like static-
        # asset revalidation pings. Keep the upgrade headers so future
        # internal sockets work without us having to revisit this block.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # First boot of the standalone server can take a few seconds —
        # don't time out the proxy connection that quickly.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Frontend: Everything else ───────────────────────────
    location / {
        # Runtime DNS resolution — see comment at top of file. Lets
        # nginx start / reload regardless of frontend container state.
        resolver 127.0.0.11 valid=30s;
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Next.js HMR / WebSocket (for potential future dev proxy usage)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

# ── WebSocket connection upgrade map ────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Edge protocol truth ─────────────────────────────────────
# cloudflared fronts this nginx over plain HTTP, so $scheme is "http"
# even for HTTPS visitors. Overwriting X-Forwarded-Proto with $scheme
# made WebDAV COPY/MOVE destination validation fail (502: client sends
# an https:// Destination, server believes it is http). Preserve the
# edge's header when present; fall back to $scheme for direct access.
map $http_x_forwarded_proto $edge_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
