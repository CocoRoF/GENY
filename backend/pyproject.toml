[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 1.20.0 — provider-driven Stage 2 / Stage 18 / index plane:
    # 1. `MemoryAwareRetriever` (Stage 2) and `ProviderDrivenStrategy`
    #    (Stage 18) talk to the `MemoryProvider` Protocol directly —
    #    no host duck-type. Legacy `GenyMemoryRetriever` / `GenyMemoryStrategy`
    #    / `GenyPersistence` deleted in upstream.
    # 2. `MemoryHooks` is a single policy + callback bag (vault_descriptions,
    #    importance_boost, layer_budget_ratio, pin_category, etc.).
    # 3. Progressive-disclosure 4-step API on `IndexHandle`
    #    (`list_categories` → `list_notes` → `read_outline` → `read_section`).
    # 4. `NoteGraph` queries (`k_hop`, `connected_component`,
    #    `linked_chain`, `notes_with_tag`).
    # 5. Executor owns hierarchical sidecars — `<cat>/_index.json` +
    #    `_summary.json` refresh incrementally on every note write.
    # 6. Stage 19 writes session-close `transcripts/summary.md` once
    #    the loop decision turns terminal (D1).
    # 7. Typed interaction fields (`event_id`, `linked_event_id`,
    #    `kind`, `direction`, `counterpart_id`, `counterpart_role`,
    #    `session_id`) on `Turn` / `Note` / `NoteDraft` / `NoteMeta`.
    "geny-executor>=1.20.0,<2.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
