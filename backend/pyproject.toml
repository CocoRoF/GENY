[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 1.17.0 ships the path-A thin-adapter EXEC track:
    # `metadata` extension field on every stage I/O dataclass (incl.
    # `Turn.from_state_message` lifting `message["metadata"]`),
    # `MemoryHooks.after_*` callbacks, `STMHandle.append_event`,
    # `NotesHandle.load_pinned`, `IndexHandle.render_vault_map`, and
    # the `_refresh_backlinks` wikilink mismatch fix. All earlier
    # 1.16.0 surfaces (composite curated/global, auto-vector on
    # note write) remain. The `[openai]` extra is required because
    # Geny's settings UI defaults the embedding provider to OpenAI.
    "geny-executor[web,cron,openai]>=1.17.2,<2.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
