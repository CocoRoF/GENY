[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 2.1.2 — Opus 4.7 unconditional sampling-param
    # rejection + retry-on-deprecation safety net.
    #
    # 2.1.1 dropped temperature/top_p/top_k when ``thinking`` was set;
    # 2.1.2 adds two more layers:
    #   1. Static prefix list — ``_TEMPERATURE_DEPRECATED_PREFIXES``
    #      currently {``claude-opus-4-7``} — drops the three sampling
    #      params unconditionally, even without ``thinking``. Closes the
    #      ``AdaptiveModelRouter`` path that auto-promotes thinking
    #      calls to Opus, AND the plain ``memory_distill``-pins-Opus
    #      path that 2.1.1 still 400'd on.
    #   2. Retry-on-deprecation — when the API returns
    #      ``... is deprecated for this model.`` for a known sampling
    #      field, _send / create_message_stream strip it and retry
    #      once. Future model deprecations self-heal without a bump.
    #
    # CLI surface unchanged — alias semantics there are intentional.
    "geny-executor>=2.1.2,<3.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
