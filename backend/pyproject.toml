[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 1.21.0 — root _index.json is a bounded folder-tree
    # summary (was an unbounded flat dump in 1.20.0). Per-note metadata
    # lives only inside <cat>/_index.json shards; the host drills via
    # the progressive-disclosure 4-step chain. <root>/_summary.json is
    # retired — its content moved into <root>/_index.json.
    #
    # Earlier 1.20.0 surfaces (provider-driven Stage 2 / Stage 18,
    # MemoryAwareRetriever, ProviderDrivenStrategy, MemoryHooks single
    # policy bag, NoteGraph queries, executor-owned hierarchical
    # sidecars, Stage 19 session-close summary, typed interaction
    # fields) all retained.
    "geny-executor>=1.21.0,<2.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
