[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 2.0.0 — LLM backend overhaul cycle. ClientRegistry
    # now ships 6 providers (anthropic / openai / google / vllm +
    # claude_code_cli / copilot_cli). Credentials flow through a single
    # CredentialBundle channel (auto-wrapped from api_key= for legacy
    # call sites). Provider location is unified at
    # manifest.stages[6].config["provider"] — strategies['provider']
    # is rejected at strict load. SubagentTypeDescriptor gains
    # provider/parallel/max_concurrent for multi-provider sub-agents.
    # Earlier 1.21.0 surfaces (bounded root _index.json, provider-driven
    # Stage 2 / Stage 18, etc.) all retained.
    "geny-executor>=2.0.5,<3.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
