[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # FAISS still required by the legacy `service.memory.vector_store`
    # path that ships alongside the new executor MemoryProvider during
    # the cut-over window. The follow-up PR drops it once every caller
    # has been ported and the legacy vault code is deleted.
    "faiss-cpu>=1.9.0",
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 1.16.0 ships the unified MemoryProvider with native
    # CuratedHandle / GlobalHandle wrappers in the composite layer plus
    # auto-vector indexing on note write. The `[openai]` extra is
    # required because Geny's settings UI defaults the embedding
    # provider to OpenAI; switching to Voyage / Google later is a
    # config flip.
    "geny-executor[web,cron,openai]>=1.16.0,<2.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
