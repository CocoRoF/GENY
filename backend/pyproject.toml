[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 1.19.0 ships:
    # 1. `LoopAgnosticLock` — memory store locks no longer bind to a
    #    single event loop, so cross-loop drives (run_coro_sync /
    #    worker-thread bridges) no longer silently swallow writes.
    #    This was the root cause of empty `_index.json` shards and
    #    missing `transcripts/session.jsonl` entries.
    # 2. Consolidated install — runtime extras (web/cron/openai/
    #    google/postgres/numpy) are now baseline `dependencies`.
    #    Hosts drop bracket suffixes and let settings.json pick the
    #    embedding provider at runtime.
    "geny-executor>=1.19.0,<2.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
