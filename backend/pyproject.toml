[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    "playwright>=1.49.0",
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 2.1.1 — Anthropic API boundary robustness:
    # AnthropicClient now expands the short aliases the ``claude`` CLI
    # accepts (``opus`` / ``sonnet`` / ``haiku``) to canonical model
    # IDs before calling the SDK, and drops temperature / top_p /
    # top_k when ``thinking`` is set (the Messages API rejects them
    # under thinking with 400 "temperature is deprecated…"). These
    # two boundary fixes mean a Geny env that pins ``thinking_enabled``
    # + an explicit temperature, or that was edited on the CLI flow
    # with a short alias, no longer round-trips 400/404 from
    # ``api.anthropic.com``. CLI surface unchanged — alias semantics
    # there are intentional.
    #
    # 2.1.0 baseline: 5 providers, CredentialBundle, MCP Phase I,
    # ExecutorErrorCode taxonomy. See CHANGELOG.md.
    "geny-executor>=2.1.1,<3.0.0",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
